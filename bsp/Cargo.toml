[package]
name        = "rice-bsp"
description = "Startup, console and exit for rice under veryl-harness or QEMU"

version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
riscv      = { version = "0.16.1", features = ["critical-section-single-hart"] }
riscv-rt   = { version = "0.18.0", features = ["memory", "post-init"] }
rtt-target = "0.6.2"
critical-section = "1.2"

[features]
# Builds for QEMU's `virt` machine instead of the board (`cargo run-emu`).
qemu = []
