# Firmware for rice on the board. `cargo run -p hello` loads it with
# `hio cpu boot` and stays on its RTT console.
[workspace]
resolver = "2"
members  = ["bsp", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rice-bsp = { path = "bsp" }

[profile.dev]
# opt-level 0 is large and slow, and the program has to fit in 64 KB.
opt-level       = 1
debug           = 2
overflow-checks = true

[profile.release]
opt-level     = "s"
debug         = 2
lto           = true
codegen-units = 1
